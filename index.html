<style>
/* PyVisualize custom styles — everything Tailwind's utility classes don't cover cleanly */

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap');

html, body { height: 100%; }
#root { min-height: 100%; }

/* Thin, dark scrollbars everywhere */
* { scrollbar-width: thin; scrollbar-color: #2d3a4f #0b0f16; }
*::-webkit-scrollbar { width: 9px; height: 9px; }
*::-webkit-scrollbar-track { background: transparent; }
*::-webkit-scrollbar-thumb { background: #2d3a4f; border-radius: 6px; }
*::-webkit-scrollbar-thumb:hover { background: #3d4f6b; }

code, pre, .font-mono { font-variant-ligatures: none; }

/* Prism code block overrides to match the dark UI */
pre[class*="language-"] {
  background: #0d1420 !important;
  border: 1px solid #1f2b3d;
  border-radius: 0.65rem;
  padding: 1rem 1.1rem !important;
  font-size: 0.85rem;
  line-height: 1.6;
  margin: 0 !important;
}
code[class*="language-"] {
  font-family: '"JetBrains Mono"', monospace !important;
  text-shadow: none !important;
}
:not(pre) > code[class*="language-"] {
  background: #0d1420;
  padding: 0.15rem 0.4rem;
  border-radius: 0.35rem;
}

/* Simple fade/slide transitions for panel + step content, no JS animation lib needed */
@keyframes fadeSlideIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}
.animate-in { animation: fadeSlideIn 0.28s ease-out both; }

@keyframes popIn {
  0% { opacity: 0; transform: scale(0.85); }
  100% { opacity: 1; transform: scale(1); }
}
.animate-pop { animation: popIn 0.25s cubic-bezier(.2,.8,.2,1) both; }

@keyframes floatUp {
  0% { opacity: 0; transform: translateY(10px) scale(0.95); }
  100% { opacity: 1; transform: translateY(0) scale(1); }
}
.animate-float { animation: floatUp 0.3s ease-out both; }

/* Diagram elements: transitions for step changes (position/highlight) */
.diagram-node {
  transition: transform 0.4s cubic-bezier(.4,0,.2,1), background-color 0.35s ease, border-color 0.35s ease, box-shadow 0.35s ease, opacity 0.35s ease;
}
.diagram-arrow { transition: opacity 0.3s ease, stroke 0.3s ease; }
.diagram-fade-enter { animation: fadeSlideIn 0.3s ease-out both; }

.glow-ring { box-shadow: 0 0 0 2px rgba(34,211,238,0.55), 0 0 18px rgba(34,211,238,0.25); }

/* Sidebar tree */
.tree-line { position: relative; }
.tree-line::before {
  content: '';
  position: absolute;
  left: -0.65rem;
  top: 0;
  bottom: 0;
  width: 1px;
  background: #1f2b3d;
}

/* Progress bar shimmer */
@keyframes shimmer {
  0% { background-position: -200px 0; }
  100% { background-position: 200px 0; }
}

.pv-focus:focus-visible {
  outline: 2px solid #22d3ee;
  outline-offset: 2px;
}

textarea.code-editor {
  font-family: '"JetBrains Mono"', monospace;
  tab-size: 4;
}

/* Utility: dashed connector for backpack/closure diagram */
.dashed-link {
  border-top: 2px dashed #475569;
}

</style>

<!-- App source, in dependency order, inlined directly (no src=) so this file

<script type="text/babel" data-presets="react">
// ============================================================================
// PyVisualize — Basics topic content
// Schema per topic: { id, title, group, explanation, diagram, code,
//                      playgroundCode, challenge:{prompt,hint,solution}, mistakes:[...] }
// ============================================================================

window.TOPICS_BASICS = [
  {
    id: 'variables-data-types',
    title: 'Variables & Data Types',
    group: 'Basics',
    explanation:
      "A variable is just a labeled sticky note pointing at a value stored in memory — not a box that holds the value itself. When you write x = 5, Python creates the integer 5 somewhere in memory and sticks the label \"x\" onto it. Every value has a type (int, float, str, bool, ...) that determines what you can do with it, and a single name can point to different types at different times.",
    diagram: {
      type: 'box',
      steps: [
        {
          bubbles: [{ id: 'b5', value: '5' }],
          labels: [{ name: 'x', bubbleId: 'b5', typeTag: 'int' }],
          note: 'x = 5 creates an int object 5 in memory, and the name x points to it.',
        },
        {
          bubbles: [{ id: 'b5', value: '5' }, { id: 'bhello', value: '"hello"' }],
          labels: [{ name: 'x', bubbleId: 'b5', typeTag: 'int' }, { name: 'y', bubbleId: 'bhello', typeTag: 'str' }],
          note: 'y = "hello" creates a completely separate str object; x is untouched.',
        },
        {
          bubbles: [{ id: 'b5', value: '5' }, { id: 'bhello', value: '"hello"' }, { id: 'b6', value: '6' }],
          labels: [{ name: 'x', bubbleId: 'b6', typeTag: 'int' }, { name: 'y', bubbleId: 'bhello', typeTag: 'str' }],
          note: "x = x + 1 doesn't change the 5 — it creates a brand-new int 6 and re-points x's label onto it. The old 5, now unreferenced, fades away.",
        },
        {
          bubbles: [{ id: 'b5', value: '5' }, { id: 'bhello', value: '"hello"' }, { id: 'b6', value: '6' }],
          labels: [
            { name: 'x', bubbleId: 'b6', typeTag: 'int' },
            { name: 'y', bubbleId: 'bhello', typeTag: 'str' },
            { name: 'z', bubbleId: 'b6', typeTag: 'int' },
          ],
          note: "z = x makes z point at the EXACT same object x points to — they share the same 6, they aren't independent copies.",
        },
      ],
    },
    code: `# A variable is a label, not a container.
x = 5          # x now points to the int object 5
y = "hello"    # y points to a different object, a str
print(type(x)) # <class 'int'>
print(type(y)) # <class 'str'>

x = x + 1      # this does NOT modify 5 in place;
               # it creates a new int 6 and re-points x to it
print(x)       # 6`,
    playgroundCode: `x = 5
y = "hello"
print(type(x), type(y))

x = x + 1
print("x is now:", x)

z = x
print("z and x point to the same object:", z is x)`,
    challenge: {
      prompt: 'Create a variable age set to 30, then create age_in_days by multiplying age by 365. Print both with a label.',
      hint: 'Multiplication creates a brand-new int — just like x = x + 1 did above.',
      solution: `age = 30
age_in_days = age * 365
print("age:", age)
print("age_in_days:", age_in_days)`,
    },
    mistakes: [
      'Thinking y = x copies the value — for mutable objects (like lists) it actually makes y point at the SAME object, so changing one changes the other.',
      'Assuming a variable "has" a fixed type. Python names are just labels — x = 5 then x = "five" is legal (though usually a sign of confusing code).',
      'Forgetting that reassignment (x = x + 1) creates a brand-new object rather than mutating the old one, for immutable types like int, float, str, tuple.',
    ],
  },

  {
    id: 'type-casting',
    title: 'Type Casting',
    group: 'Basics',
    explanation:
      'Type casting converts a value from one type to another, like translating a word into a different language — the meaning survives, the form changes. Python gives you built-in functions like int(), float(), str(), and bool() to convert between common types on demand. Casting always produces a brand-new object; it never changes the original value in place.',
    diagram: {
      type: 'box',
      steps: [
        {
          bubbles: [{ id: 's42', value: '"42"' }],
          labels: [{ name: 'raw', bubbleId: 's42', typeTag: 'str' }],
          note: 'raw holds the string "42" — text that happens to look like a number.',
        },
        {
          bubbles: [{ id: 's42', value: '"42"' }, { id: 'n42', value: '42' }],
          labels: [{ name: 'raw', bubbleId: 's42', typeTag: 'str' }, { name: 'num', bubbleId: 'n42', typeTag: 'int' }],
          note: 'num = int(raw) converts it to an actual integer 42 — a new object; raw is unaffected.',
        },
        {
          bubbles: [{ id: 's42', value: '"42"' }, { id: 'n42', value: '42' }, { id: 'f42', value: '42.0' }],
          labels: [
            { name: 'raw', bubbleId: 's42', typeTag: 'str' },
            { name: 'num', bubbleId: 'n42', typeTag: 'int' },
            { name: 'flt', bubbleId: 'f42', typeTag: 'float' },
          ],
          note: 'flt = float(num) converts the int to a float, 42.0.',
        },
        {
          bubbles: [
            { id: 's42', value: '"42"' },
            { id: 'n42', value: '42' },
            { id: 'f42', value: '42.0' },
            { id: 'btrue', value: 'True' },
          ],
          labels: [
            { name: 'raw', bubbleId: 's42', typeTag: 'str' },
            { name: 'num', bubbleId: 'n42', typeTag: 'int' },
            { name: 'flt', bubbleId: 'f42', typeTag: 'float' },
            { name: 'flag', bubbleId: 'btrue', typeTag: 'bool' },
          ],
          note: 'flag = bool(num) — any nonzero number casts to True.',
        },
      ],
    },
    code: `raw = "42"            # a string that looks like a number
num = int(raw)        # convert str -> int
flt = float(num)      # convert int -> float
flag = bool(num)      # any nonzero number is True

print(raw, type(raw))
print(num, type(num))
print(flt, type(flt))
print(flag, type(flag))`,
    playgroundCode: `raw = "42"
num = int(raw)
flt = float(num)
flag = bool(num)
print(raw, "->", num, "->", flt, "->", flag)

# Uncomment to see what happens when a string ISN'T a valid number:
# broken = int("forty-two")`,
    challenge: {
      prompt: 'Given price_text = "19.99", convert it to a float called price, then print price rounded to the nearest whole number using round().',
      hint: "float() handles decimal points; int() would just chop off everything after the decimal, not round it.",
      solution: `price_text = "19.99"
price = float(price_text)
print(round(price))`,
    },
    mistakes: [
      'int("3.5") raises a ValueError — int() cannot parse a decimal point directly; go through float() first: int(float("3.5")).',
      'bool("False") is True! Any non-empty string is truthy, no matter what text it contains.',
      'Casting a string that isn\'t numeric (int("abc")) raises ValueError — always expect this can fail on real user input.',
    ],
  },

  {
    id: 'operators',
    title: 'Operators',
    group: 'Basics',
    explanation:
      'Operators are the small symbols (+, -, ==, and, ...) that combine values into new ones, following the same order-of-operations rules as a calculator: parentheses, then exponents, then multiplication/division, then addition/subtraction. Python also has comparison operators that produce True/False, and logical operators that combine those booleans together.',
    diagram: {
      type: 'trace',
      code: 'result = 3 + 4 * 2\nis_big = result > 9\nfinal = is_big and (result != 10)',
      steps: [
        { activeLine: 0, vars: {}, output: [], note: 'Python is about to evaluate 3 + 4 * 2. Multiplication binds tighter than addition, so 4 * 2 happens first.' },
        { activeLine: 0, vars: { result: 11 }, output: [], note: '4 * 2 = 8, then 3 + 8 = 11. result now holds 11.' },
        { activeLine: 1, vars: { result: 11 }, output: [], note: 'Now the comparison runs: result > 9 → 11 > 9 → True.' },
        { activeLine: 1, vars: { result: 11, is_big: true }, output: [], note: 'is_big is now True.' },
        { activeLine: 2, vars: { result: 11, is_big: true }, output: [], note: 'final = is_big and (result != 10) — the parenthesized part evaluates first: 11 != 10 is True.' },
        { activeLine: 2, vars: { result: 11, is_big: true, final: true }, output: [], note: 'True and True → final is True.' },
      ],
    },
    code: `# Arithmetic operators follow normal math precedence:
result = 3 + 4 * 2      # 4*2 happens first -> 3+8 -> 11

# Comparison operators produce a bool:
is_big = result > 9     # True

# Logical operators (and/or/not) combine booleans:
final = is_big and (result != 10)   # True and True -> True

print(result, is_big, final)`,
    playgroundCode: `result = 3 + 4 * 2
is_big = result > 9
final = is_big and (result != 10)
print("result:", result)
print("is_big:", is_big)
print("final:", final)

# A few more operators worth knowing:
print(17 // 5)   # floor division -> 3
print(17 % 5)    # modulo (remainder) -> 2
print(2 ** 10)   # exponent -> 1024`,
    challenge: {
      prompt: 'Without running anything, predict the value of x = 2 + 3 * 4 ** 2 - 1, then check yourself in the playground.',
      hint: 'Order of operations: exponent first, then multiplication, then addition/subtraction left to right.',
      solution: `# ** first: 4 ** 2 = 16
# * next: 3 * 16 = 48
# then left-to-right: 2 + 48 - 1 = 49
x = 2 + 3 * 4 ** 2 - 1
print(x)  # 49`,
    },
    mistakes: [
      '= is assignment, == is comparison — "if x = 5:" is a syntax error; you want "if x == 5:".',
      'and/or short-circuit: in a() or b(), if a() is truthy, b() never even runs — do not rely on both sides always executing.',
      'Chained comparisons like 1 < x < 10 work in Python and mean (1 < x) and (x < 10) — handy, but easy to misread at first.',
    ],
  },

  {
    id: 'strings-methods',
    title: 'Strings & String Methods',
    group: 'Basics',
    explanation:
      "A string is an ordered, immutable sequence of characters — a strip of numbered mailboxes, each holding one character, that you're never allowed to repaint in place. You can read any character by its index (s[0]), grab slices (s[1:4]), and call built-in methods like .upper() or .split() — every one of which returns a brand-new string rather than modifying the original.",
    diagram: {

print(greeting[1])      # 'i'      - indexing

print("  padded  ".strip())         # -> 'padded'

print(greeting.split(" "))

def find_user(user_id: int) -> Optional[str]:   # returns a str OR None
    return None

def parse(value: Union[int, str]) -> str:         # accepts an int OR a str
    return str(value)

# modern syntax (3.9+) for generic containers:
scores: list[int] = [90, 85, 77]
lookup: dict[str, int] = {"Ava": 90}`,
    playgroundCode: `def add(a: int, b: int) -> int:
    return a + b

print(add(2, 3))
print(add("a", "b"))

from typing import Optional, Union

def find_user(user_id: int) -> Optional[str]:
    return None

def parse(value: Union[int, str]) -> str:
    return str(value)

print(find_user(1))
print(parse(42))
print(parse("hi"))`,
    challenge: {
      prompt: 'Add type hints to this function: def area(width, height): return width * height — parameters and return type should be float.',
      hint: 'def area(width: float, height: float) -> float:',
      solution: `def area(width: float, height: float) -> float:
    return width * height

print(area(2.5, 4.0))  # 10.0`,
    },
    mistakes: [
      'Believing type hints make Python statically typed or enforce anything at runtime — they are purely advisory; use mypy (or a runtime library like pydantic) to actually check them.',
      'Forgetting older Python versions need explicit typing imports (Optional, Union, List, Dict) before generic builtins (list[int]) were allowed directly in 3.9+.',
      'Over-annotating obvious local variables inside a function body — hints are most valuable on function signatures and public APIs, not every single local variable.',
    ],
  },
];

</script>

<script type="text/babel" data-presets="react">
// ============================================================================
// PyVisualize — diagram engine
//
// Every concept diagram is DATA, not bespoke markup: a topic supplies
// `diagram = { type, steps: [...], caption? }` and one of the renderer
// components below turns each step into a picture. All renderers share the
// same "step forward / step back" contract — nothing autoplays.
//
// Renderer types implemented here, and which topics use them:
//   box       - labeled variable -> value-bubble pointers (variables, casting, type hints)
//   sequence  - index/key based blocks: list/tuple/set/dict/string, incl. pipelines (map/filter/reduce)
//   trace     - line-by-line code execution highlight + live state table + console
//   stack     - call-stack frames pushed/popped (functions, *args/**kwargs, scope, closures-call)
//   tree      - node/edge tree (inheritance, MRO, ABCs, modules/packages, class->instance)
//   pull      - lazy "pull one value at a time" animation (generators, iterators)
//   wrap      - box-inside-box wrapping (decorators, context managers, functools, descriptors)
//   backpack  - inner function carrying enclosing scope (closures)
//   timeline  - Gantt-style concurrency bars (threading, multiprocessing, asyncio)
//   key       - single token passed between threads (the GIL)
//   heap      - objects with refcounts fading out (memory management / GC)
//   flow      - flowchart with an active path (if/elif, try/except, encapsulation, descriptors, I/O)
//   regex     - text with highlighted matching spans, advancing cursor
// ============================================================================

// NOTE: classic (non-module) <script> tags share one global lexical scope,
// so these hook references use `var` (redeclare-safe) rather than `const`/`let`,
// which would throw a SyntaxError the second time another file destructures React.
var { useState, useEffect, useMemo } = React;

// ---------------------------------------------------------------------------
// Shared chrome: step controls + the frame every diagram sits inside
// ---------------------------------------------------------------------------

function StepControls({ step, setStep, total }) {
  return (
    <div className="mt-5 flex items-center justify-center gap-2 flex-wrap">
      <button
        onClick={() => setStep((s) => Math.max(0, s - 1))}
        disabled={step === 0}
        className="pv-focus px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-800 hover:bg-slate-700 disabled:opacity-30 disabled:cursor-not-allowed border border-slate-700 transition-colors"
      >
        ← Step back
      </button>
      <span className="text-xs font-mono text-slate-500 px-2 min-w-[70px] text-center">
        step {step + 1} / {total}
      </span>
      <button
        onClick={() => setStep((s) => Math.min(total - 1, s + 1))}
        disabled={step === total - 1}
        className="pv-focus px-3 py-1.5 rounded-lg text-sm font-medium bg-cyan-500/10 hover:bg-cyan-500/20 text-cyan-300 disabled:opacity-30 disabled:cursor-not-allowed border border-cyan-800/60 transition-colors"
      >
        Step forward →
      </button>
      {step !== 0 && (
        <button
          onClick={() => setStep(0)}
          className="pv-focus px-2 py-1.5 rounded-lg text-xs text-slate-500 hover:text-slate-300 underline decoration-dotted"
        >
          reset
        </button>
      )}
    </div>
  );
}

function DiagramShell({ children, step, setStep, total, note }) {
  return (
    <div className="rounded-xl border border-slate-800 bg-[#0d1420] p-4 md:p-6">
      <div className="min-h-[200px] flex items-center justify-center overflow-x-auto py-2">
        {children}
      </div>
      {note && (
        <p key={step} className="animate-in mt-4 text-sm text-slate-400 text-center leading-relaxed">
          {note}
        </p>
      )}
      <StepControls step={step} setStep={setStep} total={total} />
    </div>
  );
}

function useStep(total) {
  const [step, setStep] = useState(0);
  const clamped = Math.min(step, total - 1);
  return [clamped, setStep];
}

// small helper badge
function Chip({ children, tone = 'slate' }) {
  const tones = {
    slate: 'bg-slate-800 text-slate-300 border-slate-700',
    cyan: 'bg-cyan-500/10 text-cyan-300 border-cyan-800/60',
    amber: 'bg-amber-500/10 text-amber-300 border-amber-800/60',
    rose: 'bg-rose-500/10 text-rose-300 border-rose-800/60',
    emerald: 'bg-emerald-500/10 text-emerald-300 border-emerald-800/60',
    violet: 'bg-violet-500/10 text-violet-300 border-violet-800/60',
  };
  return (
    <span className={`inline-block px-2 py-0.5 rounded-md border text-[11px] font-mono ${tones[tone] || tones.slate}`}>
      {children}
    </span>
  );
}

// ---------------------------------------------------------------------------
// 1. BOX — variables as labels pointing to value "bubbles"
// steps: [{ bubbles: [{id, value, tone?}], labels: [{name, bubbleId, typeTag?}], note }]
// ---------------------------------------------------------------------------
function BoxDiagram({ diagram }) {
  const [step, setStep] = useStep(diagram.steps.length);
  const s = diagram.steps[step];
  return (
    <DiagramShell step={step} setStep={setStep} total={diagram.steps.length} note={s.note}>
      <div className="flex flex-col md:flex-row items-center gap-10 md:gap-16">
        <div className="flex flex-col gap-4">
          {s.labels.map((lab) => (
            <div key={lab.name} className="flex items-center gap-3 animate-in">
              <div className="diagram-node px-3 py-2 rounded-lg bg-slate-800 border border-slate-600 font-mono text-sm text-slate-200 min-w-[90px] text-center">
                {lab.name}
                {lab.typeTag && <div className="text-[10px] text-cyan-400 mt-0.5">{lab.typeTag}</div>}
              </div>
              <svg width="60" height="24" className="diagram-arrow shrink-0">
                <defs>
                  <marker id={`arrow-${lab.name}`} markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
                    <path d="M0,0 L6,3 L0,6 Z" fill="#22d3ee" />
                  </marker>
                </defs>
                <line x1="0" y1="12" x2="52" y2="12" stroke="#22d3ee" strokeWidth="2" markerEnd={`url(#arrow-${lab.name})`} />
              </svg>
            </div>
          ))}
        </div>
        <div className="flex flex-wrap gap-6 justify-center">
          {s.bubbles.map((b) => {
            const referenced = s.labels.some((l) => l.bubbleId === b.id);
            return (
              <div
                key={b.id}
                className={`diagram-node animate-pop w-24 h-24 rounded-full border-2 flex items-center justify-center font-mono text-sm text-center px-2 ${
                  referenced ? 'border-cyan-400 bg-cyan-500/10 text-cyan-100 glow-ring' : 'border-slate-700 bg-slate-900/60 text-slate-500 opacity-50'
                }`}
              >
                {b.value}
              </div>
            );
          })}
        </div>
      </div>
    </DiagramShell>
  );
}

// ---------------------------------------------------------------------------
// 2. SEQUENCE — indexable / keyed collections, optionally a transform pipeline
// steps: [{ mode: 'list'|'dict'|'set'|'string'|'pipeline', items:[{key,value,id,tone,removed?,added?}], resultItems?:[...], fnLabel?, note }]
// ---------------------------------------------------------------------------
function SeqBlock({ item }) {
  const toneClass = {
    add: 'border-emerald-400 bg-emerald-500/10 text-emerald-100 animate-pop',
    remove: 'border-rose-400 bg-rose-500/10 text-rose-200 opacity-40 line-through',
    active: 'border-cyan-400 bg-cyan-500/10 text-cyan-100 glow-ring',
    default: 'border-slate-700 bg-slate-800/80 text-slate-200',
  }[item.tone || 'default'];
  return (
    <div className="flex flex-col items-center gap-1">
      <div className={`diagram-node min-w-[52px] h-12 px-2 rounded-lg border-2 flex items-center justify-center font-mono text-sm ${toneClass}`}>
        {item.key !== undefined ? (
          <span>
            <span className="text-violet-300">{item.key}</span>
            <span className="text-slate-500">:</span> {item.value}
          </span>
        ) : (
          item.value
        )}
      </div>
      {item.index !== undefined && <span className="text-[10px] font-mono text-slate-500">{item.index}</span>}
    </div>
  );
}

function SequenceDiagram({ diagram }) {
  const [step, setStep] = useStep(diagram.steps.length);
  const s = diagram.steps[step];
  const isSet = s.mode === 'set';
  return (
    <DiagramShell step={step} setStep={setStep} total={diagram.steps.length} note={s.note}>
      <div className="flex flex-col items-center gap-6 w-full">
        <div className={`flex gap-3 flex-wrap justify-center ${isSet ? 'max-w-md' : ''}`}>
          {s.items.map((it) => (
            <SeqBlock key={it.id} item={it} />
          ))}
          {s.items.length === 0 && <span className="text-slate-600 font-mono text-sm">empty</span>}
        </div>
        {s.mode === 'pipeline' && (
          <>
            <div className="flex items-center gap-2 text-slate-500">
              <svg width="2" height="28"><line x1="1" y1="0" x2="1" y2="28" stroke="#334155" strokeWidth="2" strokeDasharray="4 3" /></svg>
            </div>
            <div className="px-4 py-2 rounded-lg border border-violet-700 bg-violet-500/10 text-violet-200 font-mono text-sm">
              {s.fnLabel}
            </div>
            <div className="flex items-center gap-2 text-slate-500">
              <svg width="2" height="28"><line x1="1" y1="0" x2="1" y2="28" stroke="#334155" strokeWidth="2" strokeDasharray="4 3" /></svg>
            </div>
            <div className="flex gap-3 flex-wrap justify-center">
              {(s.resultItems || []).map((it) => (
                <SeqBlock key={it.id} item={it} />
              ))}
            </div>
          </>
        )}
      </div>
    </DiagramShell>
  );
}

// ---------------------------------------------------------------------------
// 3. TRACE — line-by-line execution: code lines + live variable table + console
// steps: [{ activeLine (0-indexed into diagram.code), vars: {name:value}, output: [strings], note }]
// diagram.code: string (multi-line)
// ---------------------------------------------------------------------------
function TraceDiagram({ diagram }) {
  const [step, setStep] = useStep(diagram.steps.length);
  const s = diagram.steps[step];
  const lines = diagram.code.split('\n');
  return (
    <DiagramShell step={step} setStep={setStep} total={diagram.steps.length} note={s.note}>
      <div className="grid md:grid-cols-2 gap-5 w-full items-start text-left">
        <div className="rounded-lg border border-slate-800 bg-[#0a0f18] overflow-hidden">
          {lines.map((line, i) => (
            <div
              key={i}
              className={`px-3 py-1 font-mono text-[13px] whitespace-pre transition-colors duration-300 ${
                i === s.activeLine ? 'bg-cyan-500/15 border-l-2 border-cyan-400 text-cyan-100' : 'border-l-2 border-transparent text-slate-400'
              }`}
            >
              <span className="text-slate-600 select-none mr-3">{String(i + 1).padStart(2, '0')}</span>
              {line || ' '}
            </div>
          ))}
        </div>
        <div className="flex flex-col gap-4">
          <div>
            <div className="text-xs uppercase tracking-wide text-slate-500 mb-1.5">Variables</div>
            <div className="rounded-lg border border-slate-800 bg-slate-900/50 p-3 flex flex-wrap gap-2 min-h-[44px]">
              {Object.keys(s.vars || {}).length === 0 && <span className="text-slate-600 text-xs">— none yet —</span>}
              {Object.entries(s.vars || {}).map(([k, v]) => (
                <div key={k} className="animate-pop px-2 py-1 rounded-md bg-slate-800 border border-slate-700 font-mono text-xs">
                  <span className="text-violet-300">{k}</span> <span className="text-slate-500">=</span> <span className="text-emerald-300">{String(v)}</span>
                </div>
              ))}
            </div>
          </div>
          <div>
            <div className="text-xs uppercase tracking-wide text-slate-500 mb-1.5">Console output</div>
            <div className="rounded-lg border border-slate-800 bg-black/60 p-3 font-mono text-xs min-h-[44px] text-emerald-400 space-y-0.5">
              {(s.output || []).length === 0 && <span className="text-slate-600">— nothing printed yet —</span>}
              {(s.output || []).map((line, i) => (
                <div key={i} className="animate-in">
                  &gt; {line}
                </div>
              ))}
            </div>
          </div>
        </div>
      </div>
    </DiagramShell>
  );
}

// ---------------------------------------------------------------------------
// 4. STACK — call frames pushed/popped
// steps: [{ frames: [{id, name, args, locals, returning?}], note }]
// ---------------------------------------------------------------------------
function StackDiagram({ diagram }) {
  const [step, setStep] = useStep(diagram.steps.length);
  const s = diagram.steps[step];
  return (
    <DiagramShell step={step} setStep={setStep} total={diagram.steps.length} note={s.note}>
      <div className="flex flex-col-reverse gap-2 w-full max-w-md">
        {s.frames.length === 0 && <div className="text-slate-600 font-mono text-sm text-center py-6">stack empty</div>}
        {s.frames.map((f, i) => (
          <div
            key={f.id}
            className={`diagram-node animate-float rounded-lg border-2 px-4 py-2.5 font-mono text-sm ${
              f.returning
                ? 'border-amber-400 bg-amber-500/10 text-amber-100'
                : i === s.frames.length - 1
                ? 'border-cyan-400 bg-cyan-500/10 text-cyan-100 glow-ring'
                : 'border-slate-700 bg-slate-800/70 text-slate-300'
            }`}
          >
            <div className="flex items-center justify-between gap-3">
              <span>
                {f.name}({f.args})
              </span>
              {f.returning && <span className="text-[10px] text-amber-300">returns {f.returning}</span>}
            </div>
            {f.locals && <div className="text-[11px] text-slate-500 mt-1">locals: {f.locals}</div>}
          </div>
        ))}
      </div>
    </DiagramShell>
  );
}

// ---------------------------------------------------------------------------
// 5. TREE — node/edge diagrams: inheritance, MRO, packages, class->instance
// steps: [{ nodes: [{id, label, x, y, tone?, sub?}], edges: [{from,to,label?}], note }]
// coordinates are 0..100 (percent-based) so the diagram scales
// ---------------------------------------------------------------------------
function TreeDiagram({ diagram }) {
  const [step, setStep] = useStep(diagram.steps.length);
  const s = diagram.steps[step];
  const W = 480,
    H = 260;
  const pos = (n) => ({ x: (n.x / 100) * W, y: (n.y / 100) * H });
  return (
    <DiagramShell step={step} setStep={setStep} total={diagram.steps.length} note={s.note}>
      <svg viewBox={`0 0 ${W} ${H}`} className="w-full max-w-xl" style={{ minHeight: 220 }}>
        {s.edges.map((e, i) => {
          const a = pos(s.nodes.find((n) => n.id === e.from));
          const b = pos(s.nodes.find((n) => n.id === e.to));
          if (!a || !b) return null;
          return (
            <g key={i} className="diagram-arrow">
              <line x1={a.x} y1={a.y} x2={b.x} y2={b.y} stroke={e.tone === 'active' ? '#22d3ee' : '#334155'} strokeWidth={e.tone === 'active' ? 2.5 : 1.5} />
              {e.label && (
                <text x={(a.x + b.x) / 2} y={(a.y + b.y) / 2 - 4} fontSize="9" fill="#64748b" textAnchor="middle">
                  {e.label}
                </text>
              )}
            </g>
          );
        })}
        {s.nodes.map((n) => {
          const p = pos(n);
          const tone =
            n.tone === 'active'
              ? { fill: 'rgba(34,211,238,0.15)', stroke: '#22d3ee', text: '#a5f3fc' }
              : n.tone === 'abstract'
              ? { fill: 'rgba(167,139,250,0.12)', stroke: '#8b5cf6', text: '#ddd6fe' }
              : { fill: '#1e293b', stroke: '#475569', text: '#cbd5e1' };
          const w = Math.max(56, n.label.length * 7 + 18);
          return (
            <g key={n.id} className="diagram-node" transform={`translate(${p.x - w / 2}, ${p.y - 14})`}>
              <rect width={w} height="28" rx="7" fill={tone.fill} stroke={tone.stroke} strokeWidth="1.5" />
              <text x={w / 2} y="18" fontSize="11" textAnchor="middle" fill={tone.text} fontFamily="monospace">
                {n.label}
              </text>
              {n.sub && (
                <text x={w / 2} y="40" fontSize="9" textAnchor="middle" fill="#64748b" fontFamily="monospace">
                  {n.sub}
                </text>
              )}
            </g>
          );
        })}
      </svg>
    </DiagramShell>
  );
}

// ---------------------------------------------------------------------------
// 6. PULL — lazy generation: values produced one at a time "on request"
// steps: [{ produced: [values], requesting: bool, exhausted?: bool, note }]
// ---------------------------------------------------------------------------
function PullDiagram({ diagram }) {
  const [step, setStep] = useStep(diagram.steps.length);
  const s = diagram.steps[step];
  return (
    <DiagramShell step={step} setStep={setStep} total={diagram.steps.length} note={s.note}>
      <div className="flex flex-col items-center gap-6 w-full">
        <div className="flex items-center gap-4">
          <div className="px-4 py-2 rounded-lg border border-slate-700 bg-slate-800 font-mono text-sm text-slate-300">consumer</div>
          <svg width="70" height="20">
            <defs>
              <marker id="pullArrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
                <path d="M0,0 L6,3 L0,6 Z" fill={s.requesting ? '#f59e0b' : '#334155'} />
              </marker>
            </defs>
            <line x1="65" y1="10" x2="5" y2="10" stroke={s.requesting ? '#f59e0b' : '#334155'} strokeWidth="2" markerEnd="url(#pullArrow)" className="diagram-arrow" />
          </svg>
          <div
            className={`px-4 py-2 rounded-lg border-2 font-mono text-sm ${
              s.exhausted ? 'border-rose-700 bg-rose-500/10 text-rose-300' : s.requesting ? 'border-amber-400 bg-amber-500/10 text-amber-100 animate-pulseGlow' : 'border-slate-700 bg-slate-800 text-slate-300'
            }`}
          >
            generator {s.exhausted ? '(exhausted → StopIteration)' : s.requesting ? '(computing next value…)' : '(paused, waiting)'}
          </div>
        </div>
        <div className="flex gap-2 flex-wrap justify-center min-h-[48px] items-center">
          <span className="text-xs text-slate-500 mr-1">produced so far:</span>
          {s.produced.length === 0 && <span className="text-slate-600 font-mono text-xs">(nothing yet)</span>}
          {s.produced.map((v, i) => (
            <div key={i} className="animate-pop px-3 py-1.5 rounded-md border border-emerald-700 bg-emerald-500/10 text-emerald-200 font-mono text-sm">
              {v}
            </div>
          ))}
        </div>
      </div>
    </DiagramShell>
  );
}

// ---------------------------------------------------------------------------
// 7. WRAP — box-inside-box wrapping: decorators, context managers, functools, descriptors
// steps: [{ layers: [{label, active}], resultLabel?, note }]  outer-to-inner order
// ---------------------------------------------------------------------------
function WrapDiagram({ diagram }) {
  const [step, setStep] = useStep(diagram.steps.length);
  const s = diagram.steps[step];
  return (
    <DiagramShell step={step} setStep={setStep} total={diagram.steps.length} note={s.note}>
      <div className="flex flex-col items-center gap-4">
        <Nested layers={s.layers} />
        {s.resultLabel && <Chip tone="emerald">{s.resultLabel}</Chip>}
      </div>
    </DiagramShell>
  );
}
function Nested({ layers }) {
  if (!layers.length) return null;
  const [first, ...rest] = layers;
  return (
    <div
      className={`diagram-node animate-in rounded-xl border-2 p-4 flex flex-col items-center gap-3 ${
        first.active ? 'border-cyan-400 bg-cyan-500/5 glow-ring' : 'border-slate-700 bg-slate-900/40'
      }`}
    >
      <span className={`font-mono text-xs ${first.active ? 'text-cyan-300' : 'text-slate-400'}`}>{first.label}</span>
      {rest.length > 0 ? <Nested layers={rest} /> : <span className="text-[10px] text-slate-600 font-mono px-3 py-2 border border-dashed border-slate-700 rounded-lg">original function</span>}
    </div>
  );
}

// ---------------------------------------------------------------------------
// 8. BACKPACK — closure carrying enclosing scope
// steps: [{ enclosingVars: [{name,value}], innerActive: bool, note }]
// ---------------------------------------------------------------------------
function BackpackDiagram({ diagram }) {
  const [step, setStep] = useStep(diagram.steps.length);
  const s = diagram.steps[step];
  return (
    <DiagramShell step={step} setStep={setStep} total={diagram.steps.length} note={s.note}>
      <div className="relative flex flex-col items-center">
        <div
          className={`diagram-node rounded-xl border-2 px-8 py-5 font-mono text-sm ${
            s.innerActive ? 'border-cyan-400 bg-cyan-500/10 text-cyan-100 glow-ring' : 'border-slate-700 bg-slate-800/70 text-slate-300'
          }`}
        >
          inner()
        </div>
        <svg width="4" height="26"><line x1="2" y1="0" x2="2" y2="26" stroke="#f59e0b" strokeWidth="2" strokeDasharray="3 3" /></svg>
        <div className="rounded-2xl border-2 border-amber-600 bg-amber-500/5 px-5 py-3 -mt-1">
          <div className="text-[10px] uppercase tracking-wide text-amber-400 mb-2 text-center">🎒 backpack (enclosing scope)</div>
          <div className="flex gap-2 flex-wrap justify-center">
            {s.enclosingVars.map((v) => (
              <div key={v.name} className="px-2 py-1 rounded-md bg-slate-900/60 border border-amber-800/60 font-mono text-xs text-amber-200">
                {v.name} = {v.value}
              </div>
            ))}
          </div>
        </div>
      </div>
    </DiagramShell>
  );
}

// ---------------------------------------------------------------------------
// 9. TIMELINE — Gantt-style concurrency bars
// steps: [{ lanes: [{label, segments:[{startPct,widthPct,tone}]}], cursorPct?, note }]
// ---------------------------------------------------------------------------
function TimelineDiagram({ diagram }) {
  const [step, setStep] = useStep(diagram.steps.length);
  const s = diagram.steps[step];
  const toneBg = { run: 'bg-cyan-500', wait: 'bg-slate-700', io: 'bg-amber-500', done: 'bg-emerald-600' };
  return (
    <DiagramShell step={step} setStep={setStep} total={diagram.steps.length} note={s.note}>
      <div className="w-full max-w-xl flex flex-col gap-3">
        {s.lanes.map((lane) => (
          <div key={lane.label} className="flex items-center gap-3">
            <span className="w-20 shrink-0 font-mono text-xs text-slate-400 text-right">{lane.label}</span>
            <div className="relative flex-1 h-7 bg-slate-900/60 rounded-md border border-slate-800 overflow-hidden">
              {lane.segments.map((seg, i) => (
                <div
                  key={i}
                  className={`diagram-node absolute top-0 h-full rounded-sm ${toneBg[seg.tone] || toneBg.run} ${seg.tone === 'run' ? 'opacity-90' : 'opacity-70'}`}
                  style={{ left: `${seg.startPct}%`, width: `${seg.widthPct}%` }}
                />
              ))}
              {s.cursorPct !== undefined && (
                <div className="absolute top-0 h-full w-[2px] bg-white/80" style={{ left: `${s.cursorPct}%` }} />
              )}
            </div>
          </div>
        ))}
        <div className="flex gap-4 justify-center mt-1 text-[10px] font-mono text-slate-500">
          <span><span className="inline-block w-2 h-2 bg-cyan-500 rounded-sm mr-1" />running</span>
          <span><span className="inline-block w-2 h-2 bg-amber-500 rounded-sm mr-1" />waiting on I/O</span>
          <span><span className="inline-block w-2 h-2 bg-slate-700 rounded-sm mr-1" />idle</span>
          <span><span className="inline-block w-2 h-2 bg-emerald-600 rounded-sm mr-1" />done</span>
        </div>
      </div>
    </DiagramShell>
  );
}

// ---------------------------------------------------------------------------
// 10. KEY — the GIL: a single token passed between threads
// steps: [{ threads: [{name, hasKey, waiting}], note }]
// ---------------------------------------------------------------------------
function KeyDiagram({ diagram }) {
  const [step, setStep] = useStep(diagram.steps.length);
  const s = diagram.steps[step];
  return (
    <DiagramShell step={step} setStep={setStep} total={diagram.steps.length} note={s.note}>
      <div className="flex gap-8 flex-wrap justify-center">
        {s.threads.map((t) => (
          <div key={t.name} className="flex flex-col items-center gap-2">
            <div
              className={`diagram-node w-24 h-24 rounded-full border-2 flex flex-col items-center justify-center font-mono text-xs ${
                t.hasKey ? 'border-amber-400 bg-amber-500/10 text-amber-100 glow-ring animate-pulseGlow' : 'border-slate-700 bg-slate-900/50 text-slate-500'
              }`}
            >
              {t.hasKey && <span className="text-xl mb-1">🔑</span>}
              {t.name}
              <span className="text-[10px] mt-0.5">{t.hasKey ? 'running' : t.waiting ? 'blocked' : 'idle'}</span>
            </div>
          </div>
        ))}
      </div>
    </DiagramShell>
  );
}

// ---------------------------------------------------------------------------
// 11. HEAP — objects with refcounts; garbage collected ones fade out
// steps: [{ objects: [{id,label,refcount,collected?}], note }]
// ---------------------------------------------------------------------------
function HeapDiagram({ diagram }) {
  const [step, setStep] = useStep(diagram.steps.length);
  const s = diagram.steps[step];
  return (
    <DiagramShell step={step} setStep={setStep} total={diagram.steps.length} note={s.note}>
      <div className="flex gap-6 flex-wrap justify-center">
        {s.objects.map((o) => (
          <div
            key={o.id}
            className={`diagram-node w-28 rounded-lg border-2 px-3 py-3 text-center font-mono text-xs transition-opacity ${
              o.collected ? 'opacity-20 border-rose-800 bg-rose-950/30 text-rose-500' : o.refcount === 0 ? 'border-amber-500 bg-amber-500/10 text-amber-200 animate-pulseGlow' : 'border-slate-700 bg-slate-800/70 text-slate-200'
            }`}
          >
            <div className="mb-1">{o.label}</div>
            <div className="text-[10px] text-slate-500">refcount: <span className={o.refcount === 0 ? 'text-amber-300' : 'text-cyan-300'}>{o.refcount}</span></div>
            {o.collected && <div className="text-[10px] mt-1">🗑 collected</div>}
          </div>
        ))}
      </div>
    </DiagramShell>
  );
}

// ---------------------------------------------------------------------------
// 12. FLOW — flowchart with an active path highlighted
// steps: [{ nodes:[{id,label,x,y,shape:'start'|'end'|'decision'|'process',active}], edges:[{from,to,label?,active}], note }]
// ---------------------------------------------------------------------------
function FlowDiagram({ diagram }) {
  const [step, setStep] = useStep(diagram.steps.length);
  const s = diagram.steps[step];
  const W = 480,
    H = 260;
  const pos = (n) => ({ x: (n.x / 100) * W, y: (n.y / 100) * H });
  return (
    <DiagramShell step={step} setStep={setStep} total={diagram.steps.length} note={s.note}>
      <svg viewBox={`0 0 ${W} ${H}`} className="w-full max-w-xl" style={{ minHeight: 230 }}>
        <defs>
          <marker id="flowArrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
            <path d="M0,0 L6,3 L0,6 Z" fill="#334155" />
          </marker>
          <marker id="flowArrowActive" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
            <path d="M0,0 L6,3 L0,6 Z" fill="#22d3ee" />
          </marker>
        </defs>
        {s.edges.map((e, i) => {
          const a = pos(s.nodes.find((n) => n.id === e.from));
          const b = pos(s.nodes.find((n) => n.id === e.to));
          if (!a || !b) return null;
          return (
            <g key={i} className="diagram-arrow">
              <line
                x1={a.x}
                y1={a.y}
                x2={b.x}
                y2={b.y}
                stroke={e.active ? '#22d3ee' : '#334155'}
                strokeWidth={e.active ? 2.5 : 1.5}
                markerEnd={e.active ? 'url(#flowArrowActive)' : 'url(#flowArrow)'}
              />
              {e.label && (
                <text x={(a.x + b.x) / 2 + 6} y={(a.y + b.y) / 2} fontSize="9" fill={e.active ? '#67e8f9' : '#64748b'}>
                  {e.label}
                </text>
              )}
            </g>
          );
        })}
        {s.nodes.map((n) => {
          const p = pos(n);
          const w = Math.max(60, n.label.length * 6.5 + 20);
          const h = n.shape === 'decision' ? 40 : 30;
          const tone = n.active ? { fill: 'rgba(34,211,238,0.15)', stroke: '#22d3ee', text: '#a5f3fc' } : { fill: '#1e293b', stroke: '#475569', text: '#cbd5e1' };
          return (
            <g key={n.id} className="diagram-node" transform={`translate(${p.x - w / 2}, ${p.y - h / 2})`}>
              {n.shape === 'decision' ? (
                <polygon points={`${w / 2},0 ${w},${h / 2} ${w / 2},${h} 0,${h / 2}`} fill={tone.fill} stroke={tone.stroke} strokeWidth="1.5" />
              ) : n.shape === 'start' || n.shape === 'end' ? (
                <rect width={w} height={h} rx={h / 2} fill={tone.fill} stroke={tone.stroke} strokeWidth="1.5" />
              ) : (
                <rect width={w} height={h} rx="6" fill={tone.fill} stroke={tone.stroke} strokeWidth="1.5" />
              )}
              <text x={w / 2} y={h / 2 + 4} fontSize="10" textAnchor="middle" fill={tone.text} fontFamily="monospace">
                {n.label}
              </text>
            </g>
          );
        })}
      </svg>
    </DiagramShell>
  );
}

// ---------------------------------------------------------------------------
// 13. REGEX — text with highlighted matching spans + moving cursor
// steps: [{ text, spans: [{start,end}], cursor?, note }]
// ---------------------------------------------------------------------------
function RegexDiagram({ diagram }) {
  const [step, setStep] = useStep(diagram.steps.length);
  const s = diagram.steps[step];
  const chars = s.text.split('');
  return (
    <DiagramShell step={step} setStep={setStep} total={diagram.steps.length} note={s.note}>
      <div className="flex flex-wrap justify-center gap-0.5 font-mono text-base leading-loose">
        {chars.map((c, i) => {
          const inSpan = (s.spans || []).some((sp) => i >= sp.start && i < sp.end);
          const atCursor = s.cursor === i;
          return (
            <span
              key={i}
              className={`diagram-node inline-block px-1 rounded ${inSpan ? 'bg-emerald-500/25 text-emerald-200 border border-emerald-600' : 'text-slate-400'} ${
                atCursor ? 'ring-2 ring-amber-400' : ''
              }`}
            >
              {c === ' ' ? ' ' : c}
            </span>
          );
        })}
      </div>
    </DiagramShell>
  );
}

// ---------------------------------------------------------------------------
// Router
// ---------------------------------------------------------------------------
const DIAGRAM_RENDERERS = {
  box: BoxDiagram,
  sequence: SequenceDiagram,
  trace: TraceDiagram,
  stack: StackDiagram,
  tree: TreeDiagram,
  pull: PullDiagram,
  wrap: WrapDiagram,
  backpack: BackpackDiagram,
  timeline: TimelineDiagram,
  key: KeyDiagram,
  heap: HeapDiagram,
  flow: FlowDiagram,
  regex: RegexDiagram,
};

function ConceptDiagram({ diagram }) {
  if (!diagram || !diagram.type || !diagram.steps || diagram.steps.length === 0) {
    return <div className="text-slate-500 text-sm italic">No diagram configured for this topic yet.</div>;
  }
  const Renderer = DIAGRAM_RENDERERS[diagram.type];
  if (!Renderer) {
    return <div className="text-rose-400 text-sm">Unknown diagram type: {diagram.type}</div>;
  }
  return <Renderer diagram={diagram} />;
}

window.ConceptDiagram = ConceptDiagram;

</script>

<script type="text/babel" data-presets="react">
// ============================================================================
// PyVisualize — live Python playground, powered by Pyodide (CPython -> WASM).
// One Pyodide instance is loaded lazily (on first "Run" anywhere in the app)
// and reused for every topic afterwards, so subsequent runs are instant.
// ============================================================================

var { useState, useEffect, useRef, useCallback } = React;

const PYODIDE_INDEX_URL = 'https://cdn.jsdelivr.net/pyodide/v0.26.2/full/';

function getPyodideSingleton(onProgress) {
  if (!window.__pyodidePromise) {
    onProgress && onProgress('Downloading the Python runtime (first time only, ~10-20s)…');
    window.__pyodidePromise = loadPyodide({ indexURL: PYODIDE_INDEX_URL });
  }
  return window.__pyodidePromise;
}

// ---------------------------------------------------------------------------
// A minimal code editor: a transparent <textarea> layered over a
// Prism-highlighted <pre>, scroll-synced. No external editor library needed.
// ---------------------------------------------------------------------------
function CodeEditor({ value, onChange, minHeight = 200 }) {
  const preRef = useRef(null);
  const taRef = useRef(null);
  const [html, setHtml] = useState('');

  useEffect(() => {
    try {
      const grammar = (window.Prism && Prism.languages.python) || null;
      setHtml(grammar ? Prism.highlight(value, grammar, 'python') : value.replace(/</g, '&lt;'));
    } catch (e) {
      setHtml(value.replace(/</g, '&lt;'));
    }
  }, [value]);

  const syncScroll = useCallback((e) => {
    if (preRef.current) {
      preRef.current.scrollTop = e.target.scrollTop;
      preRef.current.scrollLeft = e.target.scrollLeft;
    }
  }, []);

  const handleKeyDown = useCallback(
    (e) => {
      if (e.key === 'Tab') {
        e.preventDefault();
        const el = e.target;
        const start = el.selectionStart,
          end = el.selectionEnd;
        const newVal = value.slice(0, start) + '    ' + value.slice(end);
        onChange(newVal);
        requestAnimationFrame(() => {
          el.selectionStart = el.selectionEnd = start + 4;
        });
      }
    },
    [value, onChange]
  );

  return (
    <div className="relative rounded-lg border border-slate-800 bg-[#0d1420] overflow-hidden" style={{ height: minHeight }}>
      <pre
        ref={preRef}
        aria-hidden="true"
        className="absolute inset-0 m-0 p-3 overflow-auto pointer-events-none font-mono text-[13px] leading-6 whitespace-pre-wrap break-words"
      >
        <code dangerouslySetInnerHTML={{ __html: html + '\n' }} />
      </pre>
      <textarea
        ref={taRef}
        value={value}
        onChange={(e) => onChange(e.target.value)}
        onScroll={syncScroll}
        onKeyDown={handleKeyDown}
        spellCheck={false}
        className="code-editor pv-focus absolute inset-0 w-full h-full p-3 bg-transparent text-transparent caret-cyan-300 font-mono text-[13px] leading-6 resize-none outline-none whitespace-pre-wrap break-words overflow-auto"
      />
    </div>
  );
}

// ---------------------------------------------------------------------------
// The playground itself
// ---------------------------------------------------------------------------
function CodePlayground({ code, topicId }) {
  const [source, setSource] = useState(code);
  const [output, setOutput] = useState('');
  const [status, setStatus] = useState('idle'); // idle | loading | running | done | error
  const [loadingMsg, setLoadingMsg] = useState('');

  useEffect(() => {
    setSource(code);
    setOutput('');
    setStatus('idle');
  }, [topicId, code]);

  const handleRun = useCallback(async () => {
    setOutput('');
    try {
      setStatus(window.__pyodidePromise ? 'running' : 'loading');
      const pyodide = await getPyodideSingleton(setLoadingMsg);
      setStatus('running');
      pyodide.globals.set('_pv_source', source);
      const wrapped = [
        'import sys, io, traceback',
        '_pv_buf = io.StringIO()',
        '_pv_old_stdout = sys.stdout',
        '_pv_old_stderr = sys.stderr',
        'sys.stdout = _pv_buf',
        'sys.stderr = _pv_buf',
        'try:',
        "    exec(compile(_pv_source, '<playground>', 'exec'), {'__name__': '__main__'})",
        'except SystemExit:',
        '    pass',
        'except Exception:',
        '    traceback.print_exc()',
        'finally:',
        '    sys.stdout = _pv_old_stdout',
        '    sys.stderr = _pv_old_stderr',
        '_pv_buf.getvalue()',
      ].join('\n');
      const result = await pyodide.runPythonAsync(wrapped);
      setOutput(result && result.length ? result : '(ran with no output — try adding a print() statement)');
      setStatus('done');
    } catch (err) {
      setOutput('⚠ ' + (err && err.message ? err.message : String(err)));
      setStatus('error');
    }
  }, [source]);

  const isBusy = status === 'loading' || status === 'running';

  return (
    <div className="rounded-xl border border-slate-800 bg-[#0f1622]/60 overflow-hidden">
      <div className="flex items-center justify-between px-4 py-2.5 border-b border-slate-800 bg-slate-900/50">
        <span className="text-xs uppercase tracking-wide text-slate-500 font-semibold">Live playground — edit &amp; run real Python</span>
        <div className="flex items-center gap-2">
          <button
            onClick={() => {
              setSource(code);
              setOutput('');
              setStatus('idle');
            }}
            className="pv-focus text-xs text-slate-500 hover:text-slate-300 underline decoration-dotted"
          >
            reset code
          </button>
          <button
            onClick={handleRun}
            disabled={isBusy}
            className="pv-focus px-3.5 py-1.5 rounded-md bg-emerald-500/15 hover:bg-emerald-500/25 text-emerald-300 border border-emerald-800/60 text-xs font-semibold disabled:opacity-50 disabled:cursor-wait flex items-center gap-1.5 transition-colors"
          >
            {status === 'loading' ? (
              <>
                <Spinner /> Loading Python…
              </>
            ) : status === 'running' ? (
              <>
                <Spinner /> Running…
              </>
            ) : (
              <>▶ Run</>
            )}
          </button>
        </div>
      </div>
      <div className="p-3">
        <CodeEditor value={source} onChange={setSource} />
      </div>
      {status === 'loading' && <div className="px-4 pb-1 text-[11px] text-amber-400/90">{loadingMsg}</div>}
      <div className="px-3 pb-3">
        <div className="text-[11px] uppercase tracking-wide text-slate-500 mb-1">Output</div>
        <pre className="rounded-lg border border-slate-800 bg-black/70 p-3 font-mono text-[12px] text-emerald-400 min-h-[52px] max-h-56 overflow-auto whitespace-pre-wrap">
          {status === 'idle'
            ? 'Click "Run" to execute this exact code with a real Python interpreter (Pyodide), entirely in your browser — no server involved.'
            : status === 'error'
            ? output
            : output || (status === 'done' ? '(no output)' : '')}
        </pre>
      </div>
    </div>
  );
}

function Spinner() {
  return (
    <svg className="animate-spin h-3 w-3 text-emerald-300" viewBox="0 0 24 24" fill="none">
      <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4" />
      <path className="opacity-90" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z" />
    </svg>
  );
}

window.CodePlayground = CodePlayground;

</script>

<script type="text/babel" data-presets="react">
// ============================================================================
// PyVisualize — main application shell
// Sidebar (search + collapsible topic tree) + top progress bar + topic panel
// (explanation -> diagram -> code -> playground -> challenge -> mistakes)
// ============================================================================

var { useState, useMemo, useEffect, useCallback } = React;

const GROUPS = ['Basics', 'Intermediate', 'Advanced'];
const ALL_TOPICS = [...window.TOPICS_BASICS, ...window.TOPICS_INTERMEDIATE, ...window.TOPICS_ADVANCED];
const TOPICS_BY_GROUP = Object.fromEntries(GROUPS.map((g) => [g, ALL_TOPICS.filter((t) => t.group === g)]));
const TOPIC_INDEX = Object.fromEntries(ALL_TOPICS.map((t, i) => [t.id, i]));

// ---------------------------------------------------------------------------
// Read-only, syntax-highlighted code block (for the static example + solution)
// ---------------------------------------------------------------------------
function StaticCode({ code, label }) {
  const html = useMemo(() => {
    try {
      return Prism.highlight(code, Prism.languages.python, 'python');
    } catch (e) {
      return code.replace(/</g, '&lt;');
    }
  }, [code]);
  return (
    <div className="rounded-lg overflow-hidden border border-slate-800">
      {label && (
        <div className="px-3 py-1.5 bg-slate-900/70 border-b border-slate-800 text-[11px] uppercase tracking-wide text-slate-500">{label}</div>
      )}
      <pre className="language-python !rounded-none !border-0 !m-0 overflow-x-auto">
        <code className="language-python" dangerouslySetInnerHTML={{ __html: html }} />
      </pre>
    </div>
  );
}

// ---------------------------------------------------------------------------
// Sidebar
// ---------------------------------------------------------------------------
function Sidebar({ currentId, onSelect, completed, search, setSearch, collapsedGroups, toggleGroup, sidebarOpen, setSidebarOpen }) {
  const query = search.trim().toLowerCase();

  const visibleByGroup = useMemo(() => {
    const out = {};
    for (const g of GROUPS) {
      out[g] = query ? TOPICS_BY_GROUP[g].filter((t) => t.title.toLowerCase().includes(query)) : TOPICS_BY_GROUP[g];
    }
    return out;
  }, [query]);

  return (
    <>
      {sidebarOpen && <div className="fixed inset-0 bg-black/60 z-30 md:hidden" onClick={() => setSidebarOpen(false)} />}
      <aside
        className={`fixed md:sticky top-0 z-40 md:z-0 h-screen w-[300px] shrink-0 border-r border-slate-800 bg-[#0b0f16] flex flex-col transition-transform duration-200 ${
          sidebarOpen ? 'translate-x-0' : '-translate-x-full md:translate-x-0'
        }`}
      >
        <div className="p-4 border-b border-slate-800">
          <div className="flex items-center gap-2 mb-3">
            <span className="text-xl">🐍</span>
            <div>
              <div className="font-bold text-slate-100 leading-tight">PyVisualize</div>
              <div className="text-[11px] text-slate-500 leading-tight">learn Python, visually</div>
            </div>
            <button className="ml-auto md:hidden text-slate-500 hover:text-slate-200 px-2" onClick={() => setSidebarOpen(false)}>
              ✕
            </button>
          </div>
          <div className="relative">
            <svg className="absolute left-2.5 top-2.5 w-4 h-4 text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-4.35-4.35M17 11a6 6 0 11-12 0 6 6 0 0112 0z" />
            </svg>
            <input
              value={search}
              onChange={(e) => setSearch(e.target.value)}
              placeholder="Search topics…"
              className="pv-focus w-full pl-8 pr-3 py-2 rounded-lg bg-slate-900 border border-slate-800 text-sm text-slate-200 placeholder-slate-600 outline-none focus:border-cyan-700"
            />
          </div>
        </div>

        <nav className="flex-1 overflow-y-auto py-2 px-2">
          {GROUPS.map((group) => {
            const topics = visibleByGroup[group];
            if (query && topics.length === 0) return null;
            const collapsed = collapsedGroups.has(group) && !query;
            return (
              <div key={group} className="mb-1">
                <button
                  onClick={() => toggleGroup(group)}
                  className="pv-focus w-full flex items-center justify-between px-2 py-2 text-xs font-bold uppercase tracking-wider text-slate-500 hover:text-slate-300 rounded-md"
                >
                  <span className="flex items-center gap-1.5">
                    <GroupDot group={group} />
                    {group}
                    <span className="text-slate-600 font-normal normal-case">
                      ({TOPICS_BY_GROUP[group].filter((t) => completed.has(t.id)).length}/{TOPICS_BY_GROUP[group].length})
                    </span>
                  </span>
                  <svg className={`w-3.5 h-3.5 transition-transform ${collapsed ? '-rotate-90' : ''}`} fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 9l-7 7-7-7" />
                  </svg>
                </button>
                {!collapsed && (
                  <ul className="ml-2.5 pl-3 tree-line">
                    {topics.map((t) => {
                      const active = t.id === currentId;
                      const done = completed.has(t.id);
                      return (
                        <li key={t.id}>
                          <button
                            onClick={() => {
                              onSelect(t.id);
                              setSidebarOpen(false);
                            }}
                            className={`pv-focus w-full flex items-center gap-2 text-left px-2.5 py-1.5 my-0.5 rounded-md text-[13px] transition-colors ${
                              active ? 'bg-cyan-500/15 text-cyan-200 border border-cyan-800/50' : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/60 border border-transparent'
                            }`}
                          >
                            <span className={`w-3.5 h-3.5 rounded-full shrink-0 border flex items-center justify-center text-[9px] ${done ? 'bg-emerald-500 border-emerald-400 text-black' : 'border-slate-600 text-transparent'}`}>
                              {done ? '✓' : ''}
                            </span>
                            <span className="truncate">{t.title}</span>
                          </button>
                        </li>
                      );
                    })}
                  </ul>
                )}
              </div>
            );
          })}
          {query && GROUPS.every((g) => visibleByGroup[g].length === 0) && (
            <div className="text-center text-slate-600 text-sm py-8">No topics match "{search}"</div>
          )}
        </nav>
      </aside>
    </>
  );
}

function GroupDot({ group }) {
  const color = { Basics: 'bg-emerald-400', Intermediate: 'bg-amber-400', Advanced: 'bg-violet-400' }[group];
  return <span className={`inline-block w-1.5 h-1.5 rounded-full ${color}`} />;
}

// ---------------------------------------------------------------------------
// Top bar: progress
// ---------------------------------------------------------------------------
function TopBar({ completedCount, total, onMenu }) {
  const pct = Math.round((completedCount / total) * 100);
  return (
    <header className="sticky top-0 z-20 bg-[#0b0f16]/90 backdrop-blur border-b border-slate-800 px-4 md:px-6 py-3 flex items-center gap-4">
      <button className="md:hidden text-slate-400 hover:text-slate-200" onClick={onMenu}>
        <svg className="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>
      <div className="flex-1 flex items-center gap-3 max-w-md">
        <span className="text-xs font-mono text-slate-500 whitespace-nowrap">
          {completedCount} / {total} topics
        </span>
        <div className="flex-1 h-2 rounded-full bg-slate-800 overflow-hidden">
          <div className="h-full bg-gradient-to-r from-cyan-500 to-emerald-400 transition-all duration-500" style={{ width: `${pct}%` }} />
        </div>
        <span className="text-xs font-mono text-cyan-300 w-9 text-right">{pct}%</span>
      </div>
      <div className="hidden sm:block text-[11px] text-slate-600 font-mono">Python, from zero to advanced — self-paced</div>
    </header>
  );
}

// ---------------------------------------------------------------------------
// Section chrome for the topic panel
// ---------------------------------------------------------------------------
function Section({ index, title, children }) {
  return (
    <section className="mb-8 animate-in">
      <div className="flex items-center gap-2 mb-3">
        <span className="w-6 h-6 rounded-md bg-slate-800 border border-slate-700 flex items-center justify-center text-[11px] font-mono text-cyan-300">{index}</span>
        <h3 className="text-sm font-semibold uppercase tracking-wide text-slate-300">{title}</h3>
      </div>
      {children}
    </section>
  );
}

function Challenge({ challenge }) {
  const [showHint, setShowHint] = useState(false);
  const [showSolution, setShowSolution] = useState(false);
  return (
    <div className="rounded-xl border border-violet-900/50 bg-violet-500/[0.04] p-4 md:p-5">
      <p className="text-sm text-slate-300 leading-relaxed mb-3">{challenge.prompt}</p>
      <div className="flex flex-wrap gap-2">
        <button
          onClick={() => setShowHint((v) => !v)}
          className="pv-focus text-xs px-3 py-1.5 rounded-md border border-amber-800/60 bg-amber-500/10 text-amber-300 hover:bg-amber-500/20 transition-colors"
        >
          {showHint ? 'Hide hint' : '💡 Show hint'}
        </button>
        <button
          onClick={() => setShowSolution((v) => !v)}
          className="pv-focus text-xs px-3 py-1.5 rounded-md border border-emerald-800/60 bg-emerald-500/10 text-emerald-300 hover:bg-emerald-500/20 transition-colors"
        >
          {showSolution ? 'Hide solution' : '✅ Show solution'}
        </button>
      </div>
      {showHint && <p className="animate-in mt-3 text-xs text-amber-200/90 italic">{challenge.hint}</p>}
      {showSolution && (
        <div className="animate-in mt-3">
          <StaticCode code={challenge.solution} />
        </div>
      )}
    </div>
  );
}

function Mistakes({ mistakes }) {
  return (
    <ul className="space-y-2.5">
      {mistakes.map((m, i) => (
        <li key={i} className="flex gap-2.5 text-sm text-slate-300 leading-relaxed">
          <span className="shrink-0 text-amber-400 mt-0.5">⚠</span>
          <span>{m}</span>
        </li>
      ))}
    </ul>
  );
}

// ---------------------------------------------------------------------------
// Topic panel
// ---------------------------------------------------------------------------
function TopicPanel({ topic, completed, onToggleComplete, onNavigate }) {
  const idx = TOPIC_INDEX[topic.id];
  const prev = ALL_TOPICS[idx - 1];
  const next = ALL_TOPICS[idx + 1];
  const done = completed.has(topic.id);

  return (
    <div key={topic.id} className="max-w-4xl mx-auto px-4 md:px-8 py-8">
      <div className="flex flex-wrap items-start justify-between gap-3 mb-2">
        <div>
          <Chip tone={{ Basics: 'emerald', Intermediate: 'amber', Advanced: 'violet' }[topic.group]}>{topic.group}</Chip>
          <h1 className="text-2xl md:text-3xl font-extrabold text-slate-50 mt-2">{topic.title}</h1>
        </div>
        <button
          onClick={() => onToggleComplete(topic.id)}
          className={`pv-focus shrink-0 px-3.5 py-2 rounded-lg text-sm font-semibold border transition-colors ${
            done ? 'bg-emerald-500/15 border-emerald-700 text-emerald-300' : 'bg-slate-800 border-slate-700 text-slate-300 hover:border-slate-600'
          }`}
        >
          {done ? '✓ Completed' : 'Mark as complete'}
        </button>
      </div>

      <Section index={1} title="What it is">
        <p className="text-[15px] text-slate-300 leading-relaxed">{topic.explanation}</p>
      </Section>

      <Section index={2} title="Visualize it">
        <ConceptDiagram diagram={topic.diagram} />
      </Section>

      <Section index={3} title="Example">
        <StaticCode code={topic.code} />
      </Section>

      <Section index={4} title="Playground">
        <CodePlayground code={topic.playgroundCode} topicId={topic.id} />
      </Section>

      <Section index={5} title="Try it yourself">
        <Challenge challenge={topic.challenge} />
      </Section>

      <Section index={6} title="Common mistakes">
        <Mistakes mistakes={topic.mistakes} />
      </Section>

      <div className="flex items-center justify-between mt-10 pt-6 border-t border-slate-800">
        <button
          disabled={!prev}
          onClick={() => prev && onNavigate(prev.id)}
          className="pv-focus px-3.5 py-2 rounded-lg text-sm bg-slate-800 hover:bg-slate-700 border border-slate-700 disabled:opacity-30 disabled:cursor-not-allowed transition-colors"
        >
          ← {prev ? prev.title : ''}
        </button>
        <button
          disabled={!next}
          onClick={() => next && onNavigate(next.id)}
          className="pv-focus px-3.5 py-2 rounded-lg text-sm bg-cyan-500/10 hover:bg-cyan-500/20 text-cyan-300 border border-cyan-800/60 disabled:opacity-30 disabled:cursor-not-allowed transition-colors"
        >
          {next ? next.title : ''} →
        </button>
      </div>
    </div>
  );
}

// ---------------------------------------------------------------------------
// Root
// ---------------------------------------------------------------------------
function App() {
  const [currentId, setCurrentId] = useState(ALL_TOPICS[0].id);
  const [completed, setCompleted] = useState(() => new Set());
  const [search, setSearch] = useState('');
  const [collapsedGroups, setCollapsedGroups] = useState(() => new Set());
  const [sidebarOpen, setSidebarOpen] = useState(false);

  const topic = ALL_TOPICS[TOPIC_INDEX[currentId]] || ALL_TOPICS[0];

  const toggleGroup = useCallback((g) => {
    setCollapsedGroups((prev) => {
      const next = new Set(prev);
      next.has(g) ? next.delete(g) : next.add(g);
      return next;
    });
  }, []);

  const onToggleComplete = useCallback((id) => {
    setCompleted((prev) => {
      const next = new Set(prev);
      next.has(id) ? next.delete(id) : next.add(id);
      return next;
    });
  }, []);

  const onNavigate = useCallback((id) => {
    setCurrentId(id);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }, []);

  useEffect(() => {
    document.title = `${topic.title} — PyVisualize`;
  }, [topic.title]);

  return (
    <div className="flex min-h-screen">
      <Sidebar
        currentId={currentId}
        onSelect={onNavigate}
        completed={completed}
        search={search}
        setSearch={setSearch}
        collapsedGroups={collapsedGroups}
        toggleGroup={toggleGroup}
        sidebarOpen={sidebarOpen}
        setSidebarOpen={setSidebarOpen}
      />
      <div className="flex-1 min-w-0">
        <TopBar completedCount={completed.size} total={ALL_TOPICS.length} onMenu={() => setSidebarOpen(true)} />
        <main>
          <TopicPanel topic={topic} completed={completed} onToggleComplete={onToggleComplete} onNavigate={onNavigate} />
        </main>
        <footer className="text-center text-xs text-slate-700 pb-8">
          PyVisualize — built for self-study. {ALL_TOPICS.length} topics, Basics → Intermediate → Advanced.
        </footer>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

</script>
</body>
</html>
